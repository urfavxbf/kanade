name: Android emulator smoke test

on:
  pull_request:
    paths:
      - '.github/workflows/emulator-smoke.yml'
      - 'scripts/emulator_smoke.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Checkout latest Kanade draft
        uses: actions/checkout@v4
        with:
          ref: a13c42f0d17979aef2e260f61b1f249b1a33ea8b
          path: target-app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install build SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build guest debug app
        run: gradle --no-daemon -p target-app :app:assembleDebug
      - name: Install audio fixture generator
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: python3 scripts/emulator_smoke.py
      - name: Upload screenshots and accessibility trees
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanade-emulator-screens
          path: emulator-results/
          if-no-files-found: warn
          retention-days: 7
