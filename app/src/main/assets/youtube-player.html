<!doctype html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <style>
    * { box-sizing: border-box }
    body { margin: 0; color: #faf4e8; background: #20211f; font: 14px system-ui, sans-serif }
    #video { width: 100%; height: max(200px, calc(100vh - 92px)); background: #141513 }
    #player { width: 100%; height: 100%; border: 0; display: block }
    #status { margin: 8px 0 4px; min-height: 18px }
    .controls { display: flex; gap: 6px }
    button { border: 0; border-radius: 10px; padding: 0 12px; min-height: 44px; background: #323430; color: #faf4e8 }
    button:disabled { opacity: .45 }
  </style>
</head>
<body>
  <div id="video"><div id="player"></div></div>
  <p id="status" role="status"></p>
  <div class="controls">
    <button id="previous">Previous</button><button id="next">Next</button><button id="retry" hidden>Retry</button>
  </div>
  <script>
    const videos = __VIDEO_IDS__;
    const status = document.getElementById("status");
    const previous = document.getElementById("previous");
    const next = document.getElementById("next");
    const retry = document.getElementById("retry");
    let index = 0;
    let player;
    let ready = false;
    let foreground = true;
    let timer;

    function controls() {
      previous.disabled = index === 0;
      next.disabled = index === videos.length - 1;
      previous.hidden = next.hidden = videos.length === 1;
    }
    function reportError(message) {
      clearTimeout(timer);
      status.textContent = message;
      retry.hidden = false;
    }
    function armTimeout() {
      clearTimeout(timer);
      timer = setTimeout(() => reportError("YouTube is taking longer to load."), 20000);
    }
    function selectVideo(position) {
      index = position;
      controls();
      retry.hidden = true;
      status.textContent = "Loading video " + (index + 1) + " of " + videos.length;
      armTimeout();
      if (ready) {
        if (foreground && !document.hidden) player.loadVideoById(videos[index]);
        else player.cueVideoById(videos[index]);
      }
    }
    previous.onclick = () => selectVideo(Math.max(0, index - 1));
    next.onclick = () => selectVideo(Math.min(videos.length - 1, index + 1));
    retry.onclick = () => {
      if (!ready && !window.YT?.Player) loadApi();
      else if (!ready) createPlayer();
      selectVideo(index);
    };
    window.setKanadeForeground = value => {
      foreground = value;
      if (!value && ready) player.pauseVideo();
    };
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && ready) player.pauseVideo();
    });
    function createPlayer() {
      if (player) player.destroy();
      document.getElementById("video").innerHTML = '<div id="player"></div>';
      player = new YT.Player("player", {
        width: "100%", height: "100%", videoId: videos[index],
        playerVars: { playsinline: 1, origin: location.origin, controls: 1 },
        events: {
          onReady: () => { ready = true; selectVideo(index); },
          onAutoplayBlocked: () => {
            clearTimeout(timer);
            status.textContent = "Tap Play in the video to start.";
          },
          onStateChange: event => {
            if (event.data === YT.PlayerState.PLAYING) {
              if (!foreground || document.hidden) { player.pauseVideo(); return; }
              clearTimeout(timer);
              retry.hidden = true;
              status.textContent = "Playing " + (index + 1) + " of " + videos.length;
            } else if (event.data === YT.PlayerState.ENDED && index + 1 < videos.length && foreground && !document.hidden) {
              selectVideo(index + 1);
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
              clearTimeout(timer);
              status.textContent = event.data === YT.PlayerState.PAUSED ? "Paused" : "Finished";
            }
          },
          onError: event => reportError([101, 150].includes(event.data)
            ? "The owner disabled embedded playback for this video."
            : "YouTube could not play this video here.")
        }
      });
    }
    window.onYouTubeIframeAPIReady = createPlayer;
    function loadApi() {
      const script = document.createElement("script");
      script.src = "https://www.youtube.com/iframe_api";
      script.onerror = () => reportError("Could not connect to YouTube.");
      document.head.appendChild(script);
    }
    selectVideo(0);
    loadApi();
  </script>
</body>
</html>
